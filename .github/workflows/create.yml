name: Build and Publish

on:
  push:
    branches:
      - main
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

permissions:
  contents: write       # Needed for checkout/push
  pages: write          # Needed to deploy to GitHub Pages
  id-token: write       # Needed for deploy-pages

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      deploy_dir: ${{ steps.set-deploy-dir.outputs.deploy_dir }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: uv sync

      - name: Run generator
        run: uv run python generator.py

      - name: Set deploy directory output
        id: set-deploy-dir
        run: echo "deploy_dir=./deploy" >> $GITHUB_OUTPUT

      - name: Deploy index.html to deploy branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: deploy
          publish_dir: ./deploy
          keep_files: true

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout deploy branch
        uses: actions/checkout@v4
        with:
          ref: deploy

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Install deps
        run: npm install -g html-minifier-terser

      - name: Minify index.html
        run: html-minifier-terser index.html --collapse-whitespace --remove-comments --remove-optional-tags --minify-css true --minify-js true -o index.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
